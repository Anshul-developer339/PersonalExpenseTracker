{% extends "base.html" %}

{% block title %}{{ 'Edit' if edit else 'Add' }} Transaction - Personal Expense Tracker{% endblock %}
{% block page_title %}{{ 'Edit' if edit else 'Add' }} Transaction{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="type" class="form-label">Transaction Type</label>
                        <select class="form-select" id="type" name="type" required onchange="updateCategories()">
                            <option value="">Select Type</option>
                            <option value="income" {% if transaction and transaction.type == 'income' %}selected{% endif %}>Income</option>
                            <option value="expense" {% if transaction and transaction.type == 'expense' %}selected{% endif %}>Expense</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="amount" class="form-label">Amount (₹)</label>
                        <input type="number" step="0.01" class="form-control" id="amount" name="amount" 
                               value="{{ transaction.amount if transaction else '' }}" required min="0.01">
                    </div>
                    
                    <div class="mb-3">
                        <label for="category" class="form-label">Category</label>
                        <select class="form-select" id="category" name="category" required>
                            <option value="">Select Category</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3">{{ transaction.description if transaction else '' }}</textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label for="transaction_date" class="form-label">Date</label>
                        <input type="date" class="form-control" id="transaction_date" name="transaction_date" 
                               value="{{ transaction.transaction_date if transaction else '' }}" required>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            {{ 'Update' if edit else 'Add' }} Transaction
                        </button>
                        <a href="{{ url_for('transactions.index') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const incomeCategories = {{ income_categories|tojson }};
const expenseCategories = {{ expense_categories|tojson }};

function updateCategories() {
    const type = document.getElementById('type').value;
    const categorySelect = document.getElementById('category');
    categorySelect.innerHTML = '<option value="">Select Category</option>';
    
    const categories = type === 'income' ? incomeCategories : expenseCategories;
    categories.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        categorySelect.appendChild(option);
    });
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
    const typeSelect = document.getElementById('type');
    if (typeSelect.value) {
        updateCategories();
        const categorySelect = document.getElementById('category');
        {% if transaction %}
        categorySelect.value = '{{ transaction.category }}';
        {% endif %}
    }
});
</script>
{% endblock %}
